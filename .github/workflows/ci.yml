name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ./GatherWakaStatus/GatherWakaStatus.csproj

      - name: Build project
        run: dotnet build ./GatherWakaStatus/GatherWakaStatus.csproj --configuration Release --no-restore
